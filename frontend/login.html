<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CampusEase</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <a href="index.html" class="auth-logo">
                CampusEase
            </a>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Sign in to access your campus services.
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="role">
                        Login As
                    </label>

                    <select id="role" required>

                        <option value="">
                            Select your role
                        </option>

                        <option value="student">
                            Student
                        </option>

                        <option value="faculty">
                            Faculty
                        </option>

                        <option value="admin">
                            Administrator
                        </option>

                        <option value="maintenance">
                            Maintenance Staff
                        </option>

                    </select>

                </div>


                <button type="submit" class="auth-button">
                    Login
                </button>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </p>


            <a href="index.html" class="back-home">
                ← Back to CampusEase
            </a>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
