<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fee Payment | CampusEase</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="queue-page">


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            CampusEase
        </div>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="#">
                Services
            </a>

            <a href="#">
                Notices
            </a>

            <a href="login.html">
                Logout
            </a>

        </div>

    </nav>



    <!-- HEADER -->

    <section class="queue-header">

        <div>

            <p class="small-title">
                STUDENT SERVICES
            </p>

            <h1>
                Fee Payment 💳
            </h1>

            <p>
                Pay your course or hostel fee securely through CampusEase.
            </p>

        </div>

    </section>



    <!-- PAYMENT FORM -->

    <main class="queue-card fee-payment-page">

        <div class="section-title-row">

            <div>

                <p class="small-title">
                    PAYMENT DETAILS
                </p>

                <h2>
                    Enter Your Details
                </h2>

            </div>

        </div>


        <form id="studentFeePaymentForm">


            <!-- NAME -->

            <label for="paymentName">
                Full Name
            </label>

            <input
                type="text"
                id="paymentName"
                placeholder="Enter your full name"
                required
            >



            <!-- REGISTRATION NUMBER -->

            <label for="paymentRegdNo">
                Registration No.
            </label>

            <input
                type="text"
                id="paymentRegdNo"
                placeholder="Enter your registration number"
                required
            >



            <!-- PHONE -->

            <label for="paymentPhone">
                Phone Number
            </label>

            <input
                type="tel"
                id="paymentPhone"
                placeholder="Enter your phone number"
                maxlength="10"
                required
            >



            <!-- EMAIL -->

            <label for="paymentEmail">
                Email Address
            </label>

            <input
                type="email"
                id="paymentEmail"
                placeholder="Enter your email"
                required
            >



            <!-- COURSE -->

            <label for="paymentCourse">
                Course
            </label>

            <select
                id="paymentCourse"
                required
            >

                <option value="">
                    Select Course
                </option>

                <option value="B.Tech">
                    B.Tech
                </option>

                <option value="M.Tech">
                    M.Tech
                </option>

                <option value="MBA">
                    MBA
                </option>

                <option value="MCA">
                    MCA
                </option>

            </select>



            <!-- BRANCH -->

            <label for="paymentBranch">
                Branch
            </label>

            <select
                id="paymentBranch"
                required
            >

                <option value="">
                    Select Branch
                </option>

                <option value="CSE">
                    Computer Science & Engineering
                </option>

                <option value="ECE">
                    Electronics & Communication Engineering
                </option>

                <option value="EEE">
                    Electrical & Electronics Engineering
                </option>

                <option value="ME">
                    Mechanical Engineering
                </option>

                <option value="CE">
                    Civil Engineering
                </option>

            </select>



            <!-- FEE TYPE -->

            <label for="paymentFeeType">
                Fee Type
            </label>

            <select
                id="paymentFeeType"
                required
            >

                <option value="">
                    Select Fee Type
                </option>

                <option value="Course Fee">
                    Course Fee
                </option>

                <option value="Hostel Fee">
                    Hostel Fee
                </option>

            </select>



            <!-- AMOUNT -->

            <label for="paymentAmount">
                Amount to Pay (₹)
            </label>

            <input
                type="number"
                id="paymentAmount"
                placeholder="Enter amount"
                min="1"
                required
            >



            <!-- DATE -->

            <label for="paymentDate">
                Payment Date
            </label>

            <input
                type="date"
                id="paymentDate"
                required
            >



            <!-- PAY BUTTON -->

            <button
                type="submit"
                class="primary-btn"
            >
                Proceed to Payment →
            </button>


        </form>



        <!-- PAYMENT MESSAGE -->

        <div
            id="studentFeeMessage"
            style="display: none;"
        ></div>


    </main>



    <!-- FOOTER -->

    <footer class="footer">

        <p>
            © 2026 CampusEase. One Campus. One Platform.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
