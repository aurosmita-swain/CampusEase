<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | CampusEase</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <a href="index.html" class="auth-logo">
                CampusEase
            </a>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Join CampusEase and simplify your campus experience.
            </p>


            <form id="signupForm">

                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- ROLE -->

                <div class="form-group">

                    <label for="role">
                        Account Type
                    </label>

                    <select id="role" required>

                        <option value="">
                            Select account type
                        </option>

                        <option value="student">
                            Student
                        </option>

                        <option value="faculty">
                            Faculty
                        </option>

                        <option value="admin">
                            Administrator
                        </option>

                        <option value="maintenance">
                            Maintenance Staff
                        </option>

                    </select>

                </div>


                <!-- STUDENT TYPE -->

                <div
                    class="form-group"
                    id="studentTypeGroup"
                    style="display: none;"
                >

                    <label for="studentType">
                        Student Type
                    </label>

                    <select id="studentType">

                        <option value="">
                            Select student type
                        </option>

                        <option value="day-scholar">
                            Day Scholar
                        </option>

                        <option value="hosteller">
                            Hosteller
                        </option>

                    </select>

                </div>


                <!-- HOSTEL BLOCK -->

                <div
                    class="form-group"
                    id="hostelBlockGroup"
                    style="display: none;"
                >

                    <label for="hostelBlock">
                        Hostel Block
                    </label>

                    <select id="hostelBlock">

                        <option value="">
                            Select hostel block
                        </option>

                        <option value="Boys Hostel Block A">
                            Boys Hostel Block A
                        </option>

                        <option value="Boys Hostel Block B">
                            Boys Hostel Block B
                        </option>

                        <option value="Girls Hostel Block A">
                            Girls Hostel Block A
                        </option>

                        <option value="Girls Hostel Block B">
                            Girls Hostel Block B
                        </option>

                    </select>

                </div>


                <!-- DEPARTMENT -->

                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <input
                        type="text"
                        id="department"
                        placeholder="Enter your department"
                    >

                </div>


                <!-- SECTION -->

                <div class="form-group">

                    <label for="section">
                        Section
                    </label>

                    <select id="section" disabled>

                        <option value="">
                            Not Applicable
                        </option>

                        <option value="A">
                            Section A
                        </option>

                        <option value="B">
                            Section B
                        </option>

                        <option value="C">
                            Section C
                        </option>

                        <option value="D">
                            Section D
                        </option>

                    </select>

                </div>


                <!-- USER ID -->

                <div class="form-group">

                    <label for="userId">
                        User ID
                    </label>

                    <input
                        type="text"
                        id="userId"
                        placeholder="Enter your college/user ID"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account
                </button>

            </form>


            <!-- LOGIN LINK -->

            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <!-- HOME LINK -->

            <a href="index.html" class="back-home">
                ← Back to CampusEase
            </a>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
