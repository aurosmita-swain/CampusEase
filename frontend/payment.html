<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Payment | CampusEase</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="queue-page">


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            CampusEase
        </div>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="fees.html">
                Fees
            </a>

            <a href="login.html">
                Logout
            </a>

        </div>

    </nav>



    <!-- HEADER -->

    <section class="queue-header">

        <div>

            <p class="small-title">
                SECURE PAYMENT
            </p>

            <h1>
                Confirm Payment 💳
            </h1>

            <p>
                Review your payment details before proceeding.
            </p>

        </div>

    </section>



    <!-- PAYMENT CARD -->

    <main class="queue-card payment-confirmation-card">


        <div class="payment-summary">

            <h2>
                Payment Summary
            </h2>


            <div class="payment-row">

                <span>
                    Name
                </span>

                <strong id="confirmName">
                    -
                </strong>

            </div>


            <div class="payment-row">

                <span>
                    Registration No.
                </span>

                <strong id="confirmRegdNo">
                    -
                </strong>

            </div>


            <div class="payment-row">

                <span>
                    Phone
                </span>

                <strong id="confirmPhone">
                    -
                </strong>

            </div>


            <div class="payment-row">

                <span>
                    Email
                </span>

                <strong id="confirmEmail">
                    -
                </strong>

            </div>


            <div class="payment-row">

                <span>
                    Course
                </span>

                <strong id="confirmCourse">
                    -
                </strong>

            </div>


            <div class="payment-row">

                <span>
                    Branch
                </span>

                <strong id="confirmBranch">
                    -
                </strong>

            </div>


            <div class="payment-row">

                <span>
                    Fee Type
                </span>

                <strong id="confirmFeeType">
                    -
                </strong>

            </div>


            <div class="payment-row payment-total">

                <span>
                    Amount to Pay
                </span>

                <strong id="confirmAmount">
                    ₹0
                </strong>

            </div>

        </div>



        <!-- DEMO PAYMENT OPTIONS -->

        <div class="payment-method-section">

            <h2>
                Select Payment Method
            </h2>


            <label class="payment-option">

                <input
                    type="radio"
                    name="paymentMethod"
                    value="UPI"
                    checked
                >

                <span>
                    📱 UPI
                </span>

            </label>


            <label class="payment-option">

                <input
                    type="radio"
                    name="paymentMethod"
                    value="Card"
                >

                <span>
                    💳 Debit / Credit Card
                </span>

            </label>


            <label class="payment-option">

                <input
                    type="radio"
                    name="paymentMethod"
                    value="Net Banking"
                >

                <span>
                    🏦 Net Banking
                </span>

            </label>


            <button
                type="button"
                class="primary-btn"
                id="makePaymentBtn"
            >
                Pay Now
            </button>

        </div>



        <!-- RESULT -->

        <div
            id="paymentResult"
            style="display:none;"
        ></div>


    </main>



    <!-- FOOTER -->

    <footer class="footer">

        <p>
            © 2026 CampusEase. One Campus. One Platform.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
